<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d4dff"/>
      <stop offset="0.55" stop-color="#2f7cf6"/>
      <stop offset="1" stop-color="#00c9a7"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lens" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </radialGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0b1440" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#shine)"/>

  <g filter="url(#shadow)">
    <!-- magnifier handle -->
    <line x1="164" y1="164" x2="214" y2="214" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
    <!-- lens -->
    <circle cx="112" cy="112" r="68" fill="url(#lens)"/>
    <circle cx="112" cy="112" r="68" fill="none" stroke="#ffffff" stroke-width="16"/>
  </g>

  <g>
    <!-- Wi-Fi arcs inside the lens -->
    <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="11" opacity="0.95">
      <path d="M 76.6 72.6 A 50 50 0 0 1 147.4 72.6"/>
      <path d="M 92.2 88.2 A 28 28 0 0 1 131.8 88.2"/>
    </g>
    <circle cx="112" cy="108" r="9.5" fill="#ffffff"/>
    <!-- heartbeat line -->
    <polyline points="66,146 88,146 98,130 108,166 118,138 126,146 158,146"
              fill="none" stroke="url(#pulse)" stroke-width="10"
              stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  </g>
</svg>
